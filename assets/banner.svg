<text x="72" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#e8edf2">MySQL on Localhost</text>
<text x="72" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#8b97a6">Run your own MySQL server with XAMPP and DBeaver, then practice on a real HR</text>
