<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="MySQL on Localhost. Run your own MySQL server with XAMPP and DBeaver, then practice on a real HR database.">
<defs>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#3fe0c5"/><stop offset="0.55" stop-color="#a98bff"/>
<stop offset="1" stop-color="#f5c451"/></linearGradient>
<linearGradient id="glow" x1="1" y1="0" x2="0" y2="0">
<stop offset="0" stop-color="#f5c451" stop-opacity="0.16"/>
<stop offset="1" stop-color="#f5c451" stop-opacity="0"/></linearGradient>
<linearGradient id="fade" x1="1" y1="0" x2="0" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="1"/>
<stop offset="0.55" stop-color="#fff" stop-opacity="0.45"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="softright"><rect x="620" y="0" width="580" height="300" fill="url(#fade)"/></mask>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.6" cy="1.6" r="1.6" fill="#f5c451" fill-opacity="0.22"/></pattern>
</defs>
<rect width="1200" height="300" fill="#0a0e14"/>
