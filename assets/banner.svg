<circle cx="1040" cy="150" r="142" fill="none" stroke="#a98bff" stroke-opacity="0.19" stroke-width="1.5"/>
</g>
<circle cx="1040" cy="150" r="7" fill="#f5c451"/>
<rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#1b2430"/>
<rect x="72" y="46" width="9" height="9" fill="#3fe0c5"/>
